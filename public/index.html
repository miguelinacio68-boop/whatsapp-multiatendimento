<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp Multiatendimento</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #e5ddd5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Cabeçalho Fixo */
    .header { background-color: #075e54; color: white; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
    .header-title { font-size: 16px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .status-badge { font-size: 11px; background: #25d366; color: white; padding: 3px 8px; border-radius: 12px; font-weight: normal; }
    .status-badge.desconectado { background: #e53935; }

    .atendente-select { width: 100%; padding: 8px 12px; border-radius: 8px; border: none; font-size: 14px; background: #054c44; color: white; outline: none; }
    .atendente-select option { background: white; color: #333; }

    /* Área do Cliente e Busca */
    .cliente-bar { background: #128c7e; padding: 8px 16px; display: flex; gap: 8px; }
    .cliente-input { flex: 1; padding: 8px 12px; border-radius: 20px; border: none; font-size: 14px; outline: none; }

    /* Janela de Chat */
    .chat-container { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(#d2c9c0 1px, transparent 0); background-size: 16px 16px; }
    
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    .msg.enviada { align-self: flex-end; background-color: #dcf8c6; border-top-right-radius: 0; }
    .msg.recebida { align-self: flex-start; background-color: #ffffff; border-top-left-radius: 0; }
    .msg .atendente-tag { font-size: 11px; font-weight: bold; color: #075e54; margin-bottom: 2px; display: block; }
    .msg .hora { font-size: 10px; color: #888; text-align: right; margin-top: 4px; display: block; }

    /* Área de Envio Flutuante na Parte Inferior */
    .input-bar { background: #f0f0f0; padding: 8px 12px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #ccc; }
    .message-input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #ddd; font-size: 15px; outline: none; background: white; }
    .send-btn { background-color: #075e54; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .send-btn:active { background-color: #128c7e; }

    /* Modal de QR Code */
    .modal-qr { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; padding: 20px; text-align: center; }
    .modal-qr img { width: 250px; height: 250px; background: white; padding: 10px; border-radius: 12px; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- Modal de Conexão QR Code (se necessário escancear) -->
  <div id="modalQr" class="modal-qr" style="display: none;">
    <h3>Conectar WhatsApp</h3>
    <p>Escaneie o QR Code abaixo usando o WhatsApp Principal:</p>
    <img id="qrImage" src="" alt="QR Code WhatsApp">
  </div>

  <!-- Cabeçalho -->
  <div class="header">
    <div class="header-title">
      <span>💬 Multiatendimento</span>
      <span id="statusBadge" class="status-badge desconectado">Desconectado</span>
    </div>
    <select id="selectAtendente" class="atendente-select">
      <option value="">👤 Quem está atendendo?</option>
      <option value="Miguel Inácio">Miguel Inácio</option>
      <option value="Liliane">Liliane</option>
      <option value="Keryane">Keryane</option>
    </select>
  </div>

  <!-- Barra de Seleção do Cliente -->
  <div class="cliente-bar">
    <input type="tel" id="inputNumero" class="cliente-input" placeholder="Nº do Cliente com DDD (ex: 5563999999999)">
  </div>

  <!-- Área das Mensagens -->
  <div class="chat-container" id="chatContainer">
    <div class="msg recebida">
      <span class="atendente-tag">Sistema</span>
      Selecione seu nome acima e informe o número do cliente para iniciar o atendimento.
    </div>
  </div>

  <!-- Campo de Digitação e Botão de Envio -->
  <div class="input-bar">
    <input type="text" id="inputMensagem" class="message-input" placeholder="Digite sua mensagem...">
    <button class="send-btn" onclick="enviarMensagem()">➔</button>
  </div>

<script>
  const socket = io();

  // Status da Conexão com o WhatsApp
  socket.on('status_whatsapp', (status) => {
    const badge = document.getElementById('statusBadge');
    if (status === 'Conectado') {
      badge.innerText = 'Conectado';
      badge.className = 'status-badge';
      document.getElementById('modalQr').style.display = 'none';
    } else {
      badge.innerText = 'Desconectado';
      badge.className = 'status-badge desconectado';
    }
  });

  // Exibir QR Code se o WhatsApp deslogar ou for a primeira vez
  socket.on('qr_code', (qrUrl) => {
    document.getElementById('qrImage').src = qrUrl;
    document.getElementById('modalQr').style.display = 'flex';
  });

  // Enviar Mensagem
  function enviarMensagem() {
    const atendente = document.getElementById('selectAtendente').value;
    const numero = document.getElementById('inputNumero').value.replace(/\D/g, '');
    const texto = document.getElementById('inputMensagem').value.trim();

    if (!atendente) {
      alert('Selecione quem está atendendo no topo da tela!');
      return;
    }
    if (!numero || numero.length < 10) {
      alert('Digite o número do cliente com DDD (ex: 5563999999999).');
      return;
    }
    if (!texto) return;

    const clienteJid = `${numero}@s.whatsapp.net`;

    socket.emit('enviar_mensagem', {
      clienteJid,
      mensagem: texto,
      colaboradorNome: atendente
    });

    document.getElementById('inputMensagem').value = '';
  }

  // Receber Confirmação de Mensagem Enviada
  socket.on('mensagem_enviada', (data) => {
    const chat = document.getElementById('chatContainer');
    const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    chat.innerHTML += `
      <div class="msg enviada">
        <span class="atendente-tag">${data.colaborador}</span>
        ${data.textoLimpo}
        <span class="hora">${hora}</span>
      </div>
    `;
    chat.scrollTop = chat.scrollHeight;
  });

  // Receber Mensagem do Cliente
  socket.on('nova_mensagem_recebida', (data) => {
    const chat = document.getElementById('chatContainer');
    const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    chat.innerHTML += `
      <div class="msg recebida">
        <span class="atendente-tag">Cliente (${data.de.split('@')[0]})</span>
        ${data.texto}
        <span class="hora">${hora}</span>
      </div>
    `;
    chat.scrollTop = chat.scrollHeight;
  });
</script>
</body>
</html>
